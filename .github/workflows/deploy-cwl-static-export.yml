name: Deploy CWL static export to Firebase

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: wisptools-production
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Stage CWL export and deploy hosting
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy credentials
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] && [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT (recommended) or FIREBASE_TOKEN on this repository."
            exit 1
          fi

      - name: Checkout WISP-Management
        uses: actions/checkout@v4

      - name: Checkout Chrysalis CWL static export
        uses: actions/checkout@v4
        with:
          repository: AgenticOp-io/chrysalis
          path: chrysalis

      - name: Stage CWL static export into build/client
        run: |
          EXPORT=chrysalis/fixtures/hub-wisp-management/cwl-static-export
          test -f "$EXPORT/index.html"
          rm -rf Module_Manager/build/client
          mkdir -p Module_Manager/build
          cp -r "$EXPORT" Module_Manager/build/client
          echo "Staged $(find Module_Manager/build/client -name 'index.html' | wc -l) pages"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Deploy management + landing hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          DEPLOY_ARGS=(deploy --only hosting:management,hosting:landing --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive)
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            firebase "${DEPLOY_ARGS[@]}"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            firebase "${DEPLOY_ARGS[@]}" --token "$FIREBASE_TOKEN"
          else
            echo "::error::No Firebase deploy credentials available."
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo "Deployed CWL static export to hosting:management (management.wisptools.io)" >> "$GITHUB_STEP_SUMMARY"
          echo "Redeployed hosting:landing (wisptools.io apex / wisptools-production.web.app)" >> "$GITHUB_STEP_SUMMARY"
